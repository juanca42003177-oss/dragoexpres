<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="cache" content="no-store">
<title>DragoExpres — Panel del Dueño v4</title>
<link rel="icon" href="img/icono.png">
<style>
body{background:#0a0a0f;color:#f2f4f8;font-family:system-ui,sans-serif;margin:0;padding:0 0 70px}
.w{max-width:560px;margin:0 auto;padding:14px}
h2{color:#f0b90b;margin:12px 0 4px}
h3{font-size:14px;margin:16px 0 8px}
#login{max-width:340px;margin:70px auto;text-align:center;padding:0 16px}
input{width:100%;background:#0d0e14;border:1px solid #2a2b38;border-radius:10px;color:#fff;padding:12px;font-size:15px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:12px}
.bA{background:#f0b90b;color:#111}.bR{background:#2a2b38;color:#ff8f8f;margin-left:6px}
.card{background:#14151c;border:1px solid #2a2b38;border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.av{min-width:42px;height:42px;border-radius:50%;background:#241a05;color:#f0b90b;font-weight:900;text-align:center;line-height:42px;font-size:15px;border:1px solid #b8860b}
.card b{font-size:13.5px}
.card .s{font-size:11px;color:#9aa3b5;line-height:1.5;margin-top:3px}
.pill{font-size:9.5px;padding:2px 8px;border-radius:6px;font-weight:800}
.pend{background:#241a05;color:#ffe08a}.apro{background:#0d2015;color:#7ee2a8}.recha{background:#2a0d0d;color:#ff8f8f}
.aviso{background:#241a05;border:1px solid #b8860b;color:#ffe08a;border-radius:10px;padding:10px;font-size:12px;margin:10px 0;line-height:1.5}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}
.tab{background:#14151c;border:1px solid #2a2b38;color:#9aa3b5;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}
.tab.on{border-color:#f0b90b;color:#f0b90b}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:#14151c;border:1px solid #2a2b38;border-radius:12px;padding:10px;text-align:center}
.stat .n{font-size:21px;font-weight:900;color:#f0b90b}
.stat .l{font-size:9.5px;color:#9aa3b5}
.zbar{height:8px;background:#0d0e14;border-radius:6px;overflow:hidden;margin-top:6px}
.zbar div{height:100%;background:linear-gradient(90deg,#f0b90b,#ffd44d)}
</style>
</head>
<body>
<div id="login">
  <img src="img/logo.png" style="width:70px;border-radius:12px"><h2>DragoExpres 👑</h2>
  <p style="color:#9aa3b5;font-size:13px">Panel del dueño · v3</p>
  <input id="pass" type="password" placeholder="Contraseña de dueño" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn bA" style="margin-top:10px;width:100%;padding:12px;font-size:14px" onclick="entrar()">Entrar</button>
  <p id="err" style="color:#ff8f8f;font-size:12px"></p>
</div>
<div id="panel" style="display:none">
  <div class="w">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <h2 style="margin:0">👑 Panel del Dueño</h2>
      <span style="cursor:pointer;color:#9aa3b5;font-size:12px" onclick="salir()">Salir ✕</span>
    </div>
    <div class="aviso" id="modoAviso" style="display:none">👁 VISTA PREVIA con datos de EJEMPLO — probá todos los botones. Con la API montada en Vercel (ADMIN_PASS) acá aparecen los registros REALES de tu app.</div>
    <div class="tabs" id="tabs"></div>
    <div id="resumen"></div>
    <div id="lista"></div>
    <div id="zonas"></div>
    <div id="pedidosBox" style="display:none"></div>
  </div>
</div>
<script>
var PASS='',MODO_DEMO=false,TAB='resumen';
var DEMO=[
 {tipo:'piloto',ts:1,estado:'aprobado',datos:{nombre:'Carlos Mendoza',tel:'5555 1111',zona:'Zona 11',vehiculo:'moto',marca:'Honda',color:'rojo',placa:'C-123ABC',h24:true,equipo:true}},
 {tipo:'piloto',ts:2,estado:'pendiente',datos:{nombre:'Luis Tzoc',tel:'5555 2222',zona:'Mixco',vehiculo:'bicicleta',marca:'Trek',color:'negro',equipo:true}},
 {tipo:'piloto',ts:3,estado:'pendiente',datos:{nombre:'Miguel Ruiz',tel:'5555 3333',zona:'Villa Nueva',vehiculo:'carro',marca:'Toyota',color:'blanco',placa:'P-777XYZ'}},
 {tipo:'piloto',ts:8,estado:'pendiente',datos:{nombre:'Jorge Baten',tel:'5555 8888',zona:'Mixco',vehiculo:'moto',marca:'Suzuki',color:'negro',placa:'C-910JKL',h24:true}},
 {tipo:'piloto',ts:9,estado:'rechazado',datos:{nombre:'Anónimo Pérez',tel:'5555 9999',zona:'Zona 12',vehiculo:'bicicleta',marca:'—',color:'—',equipo:false}},
 {tipo:'piloto',ts:10,estado:'pendiente',datos:{nombre:'Byron Xumul',tel:'5555 1010',zona:'Amatitlán',vehiculo:'moto',marca:'Yamaha',color:'azul',placa:'C-345MNO'}},
 {tipo:'local',ts:4,estado:'aprobado',datos:{nombre:'Pollería El Dragón',tipo:'comida',tel:'5555 4444',zona:'Zona 11'}},
 {tipo:'local',ts:5,estado:'pendiente',datos:{nombre:'Repuestos El Chino',tipo:'repuestos',tel:'5555 5555',zona:'Zona 12'}},
 {tipo:'local',ts:11,estado:'pendiente',datos:{nombre:'Tacos Doña Lupita',tipo:'comida',tel:'5555 1112',zona:'Mixco'}},
 {tipo:'local',ts:12,estado:'aprobado',datos:{nombre:'MotoRepuestos La Báscula',tipo:'repuestos',tel:'5555 1113',zona:'Mixco'}},
 {tipo:'local',ts:13,estado:'pendiente',datos:{nombre:'Taller El Turco',tipo:'taller',tel:'5555 1114',zona:'Villa Nueva'}},
 {tipo:'flota',ts:6,estado:'pendiente',datos:{nombre:'Doña Rosa',tel:'5555 6666',zona:'Amatitlán',vehiculo:'moto',marca:'Suzuki',color:'azul',placa:'C-456DEF'}},
 {tipo:'flota',ts:14,estado:'aprobado',datos:{nombre:'Sr. Paredes',tel:'5555 1115',zona:'Zona 11',vehiculo:'pickup',marca:'Nissan',color:'blanca',placa:'P-222QRS'}},
 {tipo:'usuario',ts:7,estado:'pendiente',datos:{nombre:'María López',tel:'5555 7777',zona:'Zona 11'}},
 {tipo:'usuario',ts:15,estado:'pendiente',datos:{nombre:'Juanito Morales',tel:'5555 1116',zona:'Mixco'}},
 {tipo:'usuario',ts:16,estado:'pendiente',datos:{nombre:'Sofía Ramírez',tel:'5555 1117',zona:'Quetzaltenango'}}
];
function apiBase(){return (location.hostname.indexOf('github.io')===-1&&!window.DX_API_URL)?'/api':(window.DX_API_URL||'https://dragoexpres.vercel.app/api');}
function entrar(){
  PASS=document.getElementById('pass').value;
  fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'check'})})
  .then(r=>r.json()).then(j=>{
    if(j&&j.ok){MODO_DEMO=false;abrir();}
    else if(PASS==='dragon2026'){MODO_DEMO=true;abrir();}
    else{document.getElementById('err').textContent='Contraseña incorrecta';}
  }).catch(e=>{
    if(PASS==='dragon2026'){MODO_DEMO=true;abrir();}
    else{document.getElementById('err').textContent='Contraseña incorrecta. (La API real despierta al importar el repo a Vercel con ADMIN_PASS)';}
  });
}
function salir(){location.reload();}
function abrir(){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  if(MODO_DEMO)document.getElementById('modoAviso').style.display='block';
  pintar(DEMO);
}
function cargar(){
  fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'list'})})
  .then(r=>r.json()).then(j=>{pintar((j&&j.ok&&j.registros)||[]);});
}
function cargarPedidos(){
  fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'pedidos'})})
  .then(r=>r.json()).then(function(j){
    if(!j||!j.ok){document.getElementById('pedidosBox').innerHTML='<div class="aviso">No se pudieron cargar los pedidos.</div>';return;}
    var E={buscando:['Buscando piloto','pend'],asignado:['Asignado','pend'],aceptado:['Aceptado','apro'],en_camino:['En camino','apro'],entregado:['Entregado','apro'],cancelado:['Cancelado','recha']};
    var html='<div class="stats"><div class="stat"><div class="n">'+j.total+'</div><div class="l">PEDIDOS</div></div><div class="stat"><div class="n">Q'+j.comisiones.toFixed(2)+'</div><div class="l">COMISIONES ENTREGADAS</div></div></div>';
    if(!j.pedidos.length)html+='<div class="card"><div class="av">📦</div><div><b>Sin pedidos todavía</b><div class="s">Los pedidos de usuarios aparecen acá en vivo</div></div></div>';
    fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'pozo'})})
    .then(r2=>r2.json()).then(function(z){
      if(!z||!z.ok)return;
      var tabla=z.pilotos.map(function(p){return '<div class="s">• '+p.nombre+': '+p.entregas+' entregas'+(p.entregas>=z.meta?' ✅ meta cumplida':'')+'</div>'}).join('')||'<div class="s">Sin entregas esta semana</div>';
      document.getElementById('pozoCard').innerHTML='<div class="card"><div class="av">🏆</div><div><b>Pozo semanal de pilotos: Q'+z.pozo+'</b><div class="s">Meta '+z.meta+' entregas · Se reparte domingo 20:00 entre los que cumplan · Alimentado con 25% de comisiones de la semana</div>'+tabla+'</div></div>';
    });
    fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'liquidaciones'})})
    .then(r2=>r2.json()).then(function(l){
      if(!l||!l.ok||!l.pendientes.length)return;
      document.getElementById('liqCard').innerHTML='<div class="card"><div class="av">💰</div><div><b>Liquidaciones pendientes</b><div class="s">Pilotos que te deben comisiones. Cuando confirmes el depósito en tu banco, tocá ✅</div></div></div>'+l.pendientes.map(function(p){return '<div class="card"><div class="av">🏍️</div><div><b>'+p.nombre+' ('+p.tel+')</b><div class="s">Debe Q'+p.monto+(p.susp?' · ⛔ SUSPENDIDO':'')+'</div></div><button style="margin:auto 0 0 8px;background:#1c3a1c;border:1px solid #3f7a3f;color:#8fe28f;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700" onclick="liqOk(\''+p.tel+'\')">✅ LIQUIDADO</button></div>'}).join('');
    });
    html+='<div id="pozoCard"></div><div id="liqCard"></div>';
    j.pedidos.forEach(function(o){
      html+='<div class="card"><div class="av">'+({comida:'🍔',viaje:'🛺',repuesto:'🔧'}[o.tipo]||'📦')+'</div><div style="flex:1"><b>'+o.id+' · '+({comida:'Comida',viaje:'Viaje',repuesto:'Repuesto'}[o.tipo]||o.tipo)+'</b> <span class="pill '+(E[o.estado]?E[o.estado][1]:'pend')+'">'+(E[o.estado]?E[o.estado][0]:o.estado)+'</span><div class="s">'+o.zona+' · '+o.cliente.nombre+' ('+o.cliente.tel+')<br>'+String(o.detalle).slice(0,100)+'<br>Envío Q'+o.envio+' · Comisión Q'+o.comision+(o.piloto?' · Piloto: '+o.piloto.nombre:'')+(o.califCliente?' · Cliente: ⭐'+o.califCliente:'')+(o.pago==='transferencia'?' · 💳 '+o.referencia:'')+'</div></div></div>';
    });
    document.getElementById('pedidosBox').innerHTML=html;
  });
}
async function liqOk(tel){
  if(!confirm('¿Confirmás que este piloto ya te depositó sus comisiones?'))return;
  var r=await fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'liqOk',tel:tel})});
  var j=await r.json();if(j.ok){cargar()}
}
async function verDetalle(tel){
  var r=await fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'detalle',tel:tel})});
  var j=await r.json();if(!j||!j.ok){alert('No se pudo cargar el detalle.');return}
  var d=j.registro||{};
  var h2='<div id="detalleModal" style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;overflow:auto;padding:16px" onclick="if(event.target===this)cerrarDetalle()"><div style="max-width:600px;margin:auto;background:#12141c;border:1px solid #2a2b38;border-radius:16px;padding:18px">';
  h2+='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">'+(d.nombre||'')+'</h2><button class="btn bR" onclick="cerrarDetalle()">✕</button></div>';
  h2+='<div class="s">📱 '+(d.tel||'')+' · 📍 '+(d.zona||'')+(d.vehiculo?' · '+d.vehiculo+' '+(d.marca||'')+' '+(d.color||''):'')+(d.placa?' · 🔖 '+d.placa:'')+(d.dpi?' · DPI '+d.dpi:'')+'</div>';
  if(d.h24)h2+='<div class="s" style="color:#f0b90b">⏰ Turno 24hrs</div>';
  if(j.checks&&j.checks.length){h2+='<h3 style="margin:14px 0 6px">✅ Verificación automática</h3>'+j.checks.map(function(c){return '<div class="s" style="margin:3px 0">'+(c.ok?'✅':'❌')+' <b>'+c.k+'</b> — '+c.txt+'</div>'}).join('');}
  if(j.stats&&j.stats.entregas!==undefined){h2+='<h3 style="margin:14px 0 6px">📊 Actividad</h3><div class="s">Entregas totales: <b>'+j.stats.entregas+'</b> (esta semana: '+j.stats.semana+')<br>Ganado histórico del piloto: <b>Q'+j.stats.ganado+'</b><br>Tus comisiones acumuladas: <b style="color:#f0b90b">Q'+j.stats.comisiones+'</b>'+(j.stats.pendiente?' · pendiente de liquidar: Q'+j.stats.pendiente:'')+(j.stats.calif?'<br>⭐ '+j.stats.calif+'/5':'')+'</div>';}
  if(j.docs&&j.docs.length){h2+='<h3 style="margin:14px 0 6px">📷 Papelería ('+j.docs.length+')</h3><div>'+j.docs.map(function(doc){return '<button class="btn bW" onclick="verDoc(\''+doc.archivo+'\')">📷 '+(doc.tipo||'doc').toUpperCase()+'</button>'}).join(' ')+'</div>';}
  h2+='<div id="docImg" style="margin-top:10px"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h2);
}
function cerrarDetalle(){var m=document.getElementById('detalleModal');if(m)m.remove();}
async function verDoc(archivo){
  var r=await fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'doc',archivo:archivo})});
  var j=await r.json();
  if(j&&j.ok)document.getElementById('docImg').innerHTML='<img src="'+j.img+'" style="width:100%;border-radius:12px;border:1px solid #2a2b38">';
  else alert((j&&j.error)||'No se pudo abrir el documento.');
}
async function waResumen(tel){
  var r=await fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:'detalle',tel:tel})});
  var j=await r.json();if(!j||!j.ok){alert('No se pudo armar el resumen.');return}
  var d=j.registro,s=j.stats||{};
  var txt='Hola '+d.nombre+'! 🐉 Tu resumen DragoExpres:\n'+
    '📊 Esta semana: '+s.semana+' entregas'+(s.faltan===undefined?'':' — te faltan '+Math.max(0,20-s.semana)+' para el POZO dominical 💰')+'\n'+
    '💵 Ganado histórico: Q'+s.ganado+' ('+s.entregas+' entregas)\n'+
    '🤝 Comisiones liquidadas: Q'+s.comisiones+'\n'+
    (s.pendiente?'💰 A liquidar este domingo: Q'+s.pendiente+'\n':'')+
    'Seguí picando fuerte, el dragón va con vos 🔥';
  window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(txt),'_blank');
}
function waLink(t){t=String(t||'').replace(/[^0-9]/g,'');if(t.length===8)t='502'+t;return t;}
function inicial(n){return (n||'?').trim().charAt(0).toUpperCase();}
function pintar(regs){
  var TABS=[['resumen','📊 Resumen'],['pedidos','📦 Pedidos'],['pilotos','🏍️ Pilotos'],['locales','🔥 Locales'],['flota','🚗 Flota'],['usuarios','🍜 Usuarios'],['zonas','📍 Zonas']];
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<div class="tab'+(TAB===t[0]?' on':'')+'" onclick="ver(\''+t[0]+'\')">'+t[1]+'</div>';}).join('');
  var MAP={pilotos:'piloto',locales:'local',flota:'flota',usuarios:'usuario'};
  var f=regs.filter(function(r){return r.tipo===MAP[TAB];});
  document.getElementById('resumen').style.display=TAB==='resumen'?'block':'none';
  document.getElementById('lista').style.display=(TAB==='pilotos'||TAB==='locales'||TAB==='flota'||TAB==='usuarios')?'block':'none';
  document.getElementById('zonas').style.display=TAB==='zonas'?'block':'none';
  document.getElementById('pedidosBox').style.display=TAB==='pedidos'?'block':'none';
  if(TAB==='pedidos'){cargarPedidos();}
  if(TAB==='resumen'){
    var n={pilotos:0,locales:0,flota:0,usuario:0,pen:0,apro:0};
    regs.forEach(function(r){n[r.tipo]=(n[r.tipo]||0)+1;if(r.estado==='aprobado')n.apro++;if(r.estado==='pendiente')n.pen++;});
    var zz={};
    regs.forEach(function(r){var k=(r.datos&&r.datos.zona)||'—';if(!zz[k])zz[k]={p:0,l:0};if(r.tipo==='piloto'&&r.estado==='aprobado')zz[k].p++;if(r.tipo==='local'&&r.estado==='aprobado')zz[k].l++;});
    var mejor=null,falta=999;
    Object.keys(zz).forEach(function(k){var f2=(25-zz[k].p)+(25-zz[k].l);if(f2<falta){falta=f2;mejor=k;}});
    document.getElementById('resumen').innerHTML='<div class="stats">'+
      '<div class="stat"><div class="n">'+(n.piloto||0)+'</div><div class="l">PILOTOS</div></div>'+
      '<div class="stat"><div class="n">'+(n.local||0)+'</div><div class="l">LOCALES</div></div>'+
      '<div class="stat"><div class="n">'+(n.flota||0)+'</div><div class="l">VEHÍCULOS</div></div>'+
      '<div class="stat"><div class="n">'+(n.usuario||0)+'</div><div class="l">USUARIOS</div></div></div>'+
      '<div class="card"><div class="av">⏳</div><div><b>'+n.pen+' pendientes de tu aprobación</b><div class="s">Revisá la pestaña de cada rol y aprobá con 1 botón</div></div></div>'+
      '<div class="card"><div class="av">✅</div><div><b>'+n.apro+' aprobados</b><div class="s">Los aprobados suman para activar su zona</div></div></div>'+
      (mejor&&falta>0?'<div class="card"><div class="av">📍</div><div><b>Zona más cercana a activarse: '+mejor+'</b><div class="s">Faltan '+falta+' verificaciones para encender el servicio ahí</div></div></div>':'')+
      '<div class="card"><div class="av">💰</div><div><b>Tus comisiones activas</b><div class="s">Comida 10% · Repuestos 8% · Viajes Q2–Q5 · 3 meses sin comisión al lanzar cada zona</div></div></div>';
  }
  if(TAB==='zonas'){
    var z={};
    regs.forEach(function(r){var k=(r.datos&&r.datos.zona)||'Sin área';if(!z[k])z[k]={p:0,l:0};if(r.tipo==='piloto'&&r.estado==='aprobado')z[k].p++;if(r.tipo==='local'&&r.estado==='aprobado')z[k].l++;});
    var html='';
    Object.keys(z).forEach(function(k){var v=z[k];var pr=Math.round(Math.min(v.p,25)/25*100),lr=Math.round(Math.min(v.l,25)/25*100);
      html+='<div class="card" style="display:block"><b>📍 '+k+'</b>'+(v.p>=25&&v.l>=25?' <span class="pill apro">LISTA PARA ACTIVAR 🚀</span>':'')+
      '<div class="s">Pilotos verificados: '+v.p+'/25</div><div class="zbar"><div style="width:'+pr+'%"></div></div>'+
      '<div class="s">Locales verificados: '+v.l+'/25</div><div class="zbar"><div style="width:'+lr+'%"></div></div></div>';});
    document.getElementById('zonas').innerHTML=html||'<div class="card">Sin registros aún.</div>';
  }
  var ic={piloto:'🏍️',local:'🔥',flota:'🚗',usuario:'🍜'};
  var TABLBL={pilotos:'Pilotos',locales:'Locales',flota:'Flota',usuarios:'Usuarios'};
  if(TABLBL[TAB]){var pend=f.filter(function(r){return r.estado==='pendiente';}).length;
    html2='<h3>'+TABLBL[TAB]+' — '+f.length+' registrados · '+pend+' pendientes de aprobar</h3>'+html2;}
  var html2='';
  f.slice().reverse().forEach(function(r){
    var d=r.datos||{};
    var pill=r.estado==='aprobado'?'<span class="pill apro">APROBADO</span>':(r.estado==='rechazado'?'<span class="pill recha">RECHAZADO</span>':'<span class="pill pend">PENDIENTE</span>');
    html2+='<div class="card"><div class="av">'+inicial(d.nombre)+'</div><div style="flex:1"><b>'+(d.nombre||'')+'</b> '+pill+
      '<div class="s">📱 '+(d.tel||'')+' · 📍 '+(d.zona||'')+
      (d.vehiculo?' · 🛵 '+d.vehiculo:'')+(d.marca?' · '+d.marca+' '+(d.color||''):'')+(d.placa?' · 🔖 '+d.placa:'')+
      (d.tipo?' · '+d.tipo:'')+
      (d.h24?' · <b style="color:#f0b90b">24hrs</b>':'')+(d.equipo!==undefined?' · '+(d.equipo?'🪖 equipo OK':'<b style="color:#ff8f8f">SIN equipo</b>'):'')+'</div></div>'+
      '<div><a class="btn bW" style="background:#1d5a35;color:#a8f0c6;text-decoration:none" href="https://wa.me/'+waLink(d.tel)+'">💬</a>'+
      '<button class="btn bW" onclick="verDetalle(\''+waLink(d.tel)+'\')">📄</button>'+
      (r.tipo==='piloto'?'<button class="btn bW" style="background:#0d3d63;color:#a8dcf0" onclick="waResumen(\''+waLink(d.tel)+'\')">📲</button>':'')+
      (r.tipo!=='usuario'?'<button class="btn bA" onclick="estado(\''+r.ts+'\',\'aprobar\')">✓</button><button class="btn bR" onclick="estado(\''+r.ts+'\',\'rechazar\')">✕</button></div>':'')+
      '</div>';
  });
  document.getElementById('lista').innerHTML=html2||'<div class="card">Sin registros en esta sección.</div>';
}
function ver(t){TAB=t;pintar(MODO_DEMO?DEMO:window.REGS||DEMO);if(!MODO_DEMO)cargar();}
function estado(ts,acc){
  if(MODO_DEMO){var r=DEMO.find(function(x){return String(x.ts)===String(ts);});if(r){r.estado=acc==='aprobar'?'aprobado':'rechazado';pintar(DEMO);}return;}
  fetch(apiBase()+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,action:acc,ts:ts})})
  .then(r=>r.json()).then(j=>{if(j&&j.ok)cargar();else alert('No se pudo actualizar.');});
}
</script>
